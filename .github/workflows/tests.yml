name: BroncosHub tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: event-hub
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: broncoshub_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      TEST_POSTGRES_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/broncoshub_tests
      NOTIFICATION_EMAIL_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: event-hub/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-production.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run SQLite and PostgreSQL tests
        run: python -m pytest -q tests tools
