# Free web service; durable database and private image storage live in Supabase.
# Fill secrets privately in Render. Never add them to this file.
services:
  - type: web
    name: broncoshub
    runtime: python
    plan: free
    region: oregon
    rootDir: event-hub
    buildCommand: pip install -r requirements-production.txt
    startCommand: python tools/start_production.py
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: broncoshub
      - key: REQUIRE_EXTERNAL_STORAGE
        value: 'true'
      - key: COVER_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: event-covers
      - key: TRUST_PROXY
        value: 'true'
      - key: PAYMENT_PROVIDER
        value: disabled
      - key: STRIPE_LIVE_MODE
        value: 'false'
      - key: ALLOWED_EMAIL_DOMAIN
        value: scu.edu
      - key: SUPPORT_EMAIL
        value: ecan@scu.edu
      - key: RATE_LIMIT_ENABLED
        value: 'true'
      - key: NOTIFICATION_EMAIL_PROVIDER
        # Keep the dashboard's reviewed sender setting across Blueprint syncs.
        # Use disabled on a new service until sender verification is complete.
        sync: false
